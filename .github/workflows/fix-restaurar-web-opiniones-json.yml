name: Restaurar web y opiniones JSON

on:
  push:
    branches:
      - fix/restaurar-web-opiniones-json-logo

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix: restaurar web, logo y opiniones JSON'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restaurar-web-opiniones-json-logo
          fetch-depth: 0

      - name: Restaurar diseño original y aplicar ajustes solicitados
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, subprocess

          ROOT = Path('.')
          BASE = '51cb79f2e6c108bc794b345730fe7e03c321f450'

          # 1) Restaurar el encabezado que existía antes del cambio global de Noticias.
          header = subprocess.check_output(
              ['git', 'show', f'{BASE}:encabezado.php'],
              text=True,
              encoding='utf-8'
          )

          header = header.replace(
              "$mcSiteHeader = mc_site(); ?>",
              "$mcSiteHeader = mc_site(); $mcNewsLabel = $mcSiteHeader['nav_news_label'] ?? 'Noticias'; $mcNewsUrl = $mcSiteHeader['nav_news_url'] ?? 'noticias.php'; ?>",
              1
          )

          desktop_marker = '            <div class="mc-credit-menu">'
          desktop_news = '''            <a href="<?= mc_h($mcNewsUrl) ?>">\n                <?= mc_h($mcNewsLabel) ?>\n            </a>\n\n'''
          if desktop_marker not in header:
              raise SystemExit('No se encontró el punto para insertar Noticias en escritorio')
          header = header.replace(desktop_marker, desktop_news + desktop_marker, 1)

          mobile_marker = '''        <a href="<?= mc_h($mcSiteHeader['nav_credits_url']) ?>">'''
          mobile_news = '''        <a href="<?= mc_h($mcNewsUrl) ?>">\n\n            <i class="fas fa-newspaper"></i>\n\n            <?= mc_h($mcNewsLabel) ?>\n\n        </a>\n\n\n'''
          if mobile_marker not in header:
              raise SystemExit('No se encontró el punto para insertar Noticias en móvil')
          header = header.replace(mobile_marker, mobile_news + mobile_marker, 1)

          # El nuevo logo está recortado y sin fondo, así que no necesita el alto exagerado del logo anterior.
          header = header.replace('''    height:\n        150px;\n\n    max-width:\n        180px;''', '''    height:\n        62px;\n\n    max-width:\n        240px;''', 1)
          header = header.replace('''        height:\n            42px;\n\n        max-width:\n            150px;''', '''        height:\n            46px;\n\n        max-width:\n            190px;''', 1)
          header = header.replace('''        height:\n            39px;\n\n        max-width:\n            135px;''', '''        height:\n            43px;\n\n        max-width:\n            175px;''', 1)

          Path('encabezado.php').write_text(header, encoding='utf-8')

          # 2) Usar el logo entregado por el usuario, ya procesado sin fondo negro.
          site_path = Path('cms/data/site.json')
          site = json.loads(site_path.read_text(encoding='utf-8'))
          site['logo'] = 'img/multicredit-logo-color.webp'
          site['nav_news_label'] = 'Noticias'
          site['nav_news_url'] = 'noticias.php'
          site_path.write_text(
              json.dumps(site, ensure_ascii=False, indent=4) + '\n',
              encoding='utf-8'
          )

          # 3) Asegurar que "Sitios de interés" sea legible sobre fondo claro u oscuro.
          footer_path = Path('footer.php')
          footer = footer_path.read_text(encoding='utf-8')
          footer = footer.replace(
              'class="text-gray-700 font-bold text-lg hover:text-brand-green transition"',
              'class="mc-interest-link font-bold text-lg transition"'
          )
          interest_css = '''\n.mc-interest-link {\n    color: #123b6d !important;\n    text-decoration: none;\n}\n.mc-interest-link:hover,\n.mc-interest-link:focus {\n    color: #f26e22 !important;\n}\n'''
          if '.mc-interest-link {' not in footer:
              footer = footer.replace('</style>', interest_css + '\n</style>', 1)
          footer_path.write_text(footer, encoding='utf-8')

          # 4) Volver a almacenar las opiniones en JSON, sin depender de MySQL.
          opinions_php = r'''<?php

function mc_opinion_sedes() {
    return ['Cajamarca', 'San Marcos', 'Cajabamba', 'Huamachuco'];
}

function mc_opinions_storage_path() {
    return __DIR__ . '/data/opiniones.json';
}

function mc_opinions_install() {
    $path = mc_opinions_storage_path();
    $dir = dirname($path);
    if (!is_dir($dir) && !@mkdir($dir, 0775, true) && !is_dir($dir)) {
        throw new RuntimeException('No se pudo crear la carpeta de opiniones.');
    }
    if (!is_file($path)) {
        $initial = [
            'next_id' => 1,
            'items' => [],
        ];
        $json = json_encode($initial, JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES);
        if ($json === false || @file_put_contents($path, $json . PHP_EOL, LOCK_EX) === false) {
            throw new RuntimeException('No se pudo crear el archivo JSON de opiniones.');
        }
    }
    return true;
}

function mc_opinions_normalize_state($state) {
    if (!is_array($state)) $state = [];
    $items = isset($state['items']) && is_array($state['items']) ? array_values($state['items']) : [];
    $maxId = 0;
    foreach ($items as &$item) {
        if (!is_array($item)) $item = [];
        $item['id'] = max(0, (int)($item['id'] ?? 0));
        $maxId = max($maxId, $item['id']);
        $item['nombre'] = trim((string)($item['nombre'] ?? ''));
        $item['sede'] = trim((string)($item['sede'] ?? ''));
        $item['calificacion'] = max(1, min(5, (int)($item['calificacion'] ?? 5)));
        $item['comentario'] = trim((string)($item['comentario'] ?? ''));
        $item['consentimiento'] = !empty($item['consentimiento']) ? 1 : 0;
        $item['estado'] = in_array(($item['estado'] ?? ''), ['pendiente','publicado','rechazado','oculto'], true)
            ? $item['estado'] : 'pendiente';
        $item['destacado'] = !empty($item['destacado']) ? 1 : 0;
        $item['ip_hash'] = (string)($item['ip_hash'] ?? '');
        $item['created_at'] = (string)($item['created_at'] ?? date('Y-m-d H:i:s'));
        $item['updated_at'] = (string)($item['updated_at'] ?? $item['created_at']);
    }
    unset($item);
    return [
        'next_id' => max($maxId + 1, (int)($state['next_id'] ?? 1)),
        'items' => $items,
    ];
}

function mc_opinions_read_state() {
    mc_opinions_install();
    $path = mc_opinions_storage_path();
    $raw = @file_get_contents($path);
    if ($raw === false) throw new RuntimeException('No se pudo leer el archivo JSON de opiniones.');
    $decoded = json_decode($raw, true);
    if (!is_array($decoded)) {
        throw new RuntimeException('El archivo JSON de opiniones no tiene un formato válido.');
    }
    return mc_opinions_normalize_state($decoded);
}

function mc_opinions_write_state($state) {
    $state = mc_opinions_normalize_state($state);
    $json = json_encode($state, JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES);
    if ($json === false) throw new RuntimeException('No se pudo convertir las opiniones a JSON.');
    $path = mc_opinions_storage_path();
    if (@file_put_contents($path, $json . PHP_EOL, LOCK_EX) === false) {
        throw new RuntimeException('No se pudo guardar el archivo JSON de opiniones.');
    }
    return true;
}

function mc_opinion_ip_hash() {
    $ip = trim((string)($_SERVER['REMOTE_ADDR'] ?? ''));
    if ($ip === '') $ip = 'local';
    return hash('sha256', 'multicredit-opiniones|' . $ip);
}

function mc_opinion_rate_limited($ipHash, $minutes = 10) {
    if ($ipHash === '') return false;
    $limit = time() - max(1, (int)$minutes) * 60;
    $state = mc_opinions_read_state();
    foreach ($state['items'] as $item) {
        if (!hash_equals((string)($item['ip_hash'] ?? ''), (string)$ipHash)) continue;
        $created = strtotime((string)($item['created_at'] ?? '')) ?: 0;
        if ($created >= $limit) return true;
    }
    return false;
}

function mc_opinion_create($data) {
    $state = mc_opinions_read_state();
    $id = (int)$state['next_id'];
    $now = date('Y-m-d H:i:s');
    $sede = trim((string)($data['sede'] ?? ''));
    $rating = (int)($data['calificacion'] ?? 0);
    $comment = trim((string)($data['comentario'] ?? ''));
    if (!in_array($sede, mc_opinion_sedes(), true)) throw new RuntimeException('Selecciona una sede válida.');
    if ($rating < 1 || $rating > 5) throw new RuntimeException('La calificación debe estar entre 1 y 5.');
    if ($comment === '') throw new RuntimeException('El comentario no puede quedar vacío.');

    $state['items'][] = [
        'id' => $id,
        'nombre' => trim((string)($data['nombre'] ?? '')),
        'sede' => $sede,
        'calificacion' => $rating,
        'comentario' => $comment,
        'consentimiento' => 1,
        'estado' => 'pendiente',
        'destacado' => 0,
        'ip_hash' => (string)($data['ip_hash'] ?? ''),
        'created_at' => $now,
        'updated_at' => $now,
    ];
    $state['next_id'] = $id + 1;
    mc_opinions_write_state($state);
    return $id;
}

function mc_opinions_public($limit = 18) {
    $state = mc_opinions_read_state();
    $items = array_values(array_filter($state['items'], function ($item) {
        return ($item['estado'] ?? '') === 'publicado' && !empty($item['consentimiento']);
    }));
    usort($items, function ($a, $b) {
        $featured = (int)($b['destacado'] ?? 0) <=> (int)($a['destacado'] ?? 0);
        if ($featured !== 0) return $featured;
        $date = (strtotime((string)($b['created_at'] ?? '')) ?: 0) <=> (strtotime((string)($a['created_at'] ?? '')) ?: 0);
        if ($date !== 0) return $date;
        return (int)($b['id'] ?? 0) <=> (int)($a['id'] ?? 0);
    });
    $limit = max(1, min(100, (int)$limit));
    return array_slice($items, 0, $limit);
}

function mc_opinions_summary() {
    $items = mc_opinions_public(10000);
    $count = count($items);
    $sum = 0;
    foreach ($items as $item) $sum += (int)($item['calificacion'] ?? 0);
    return [
        'average' => $count > 0 ? round($sum / $count, 1) : 0,
        'count' => $count,
    ];
}

function mc_opinions_admin_stats() {
    $state = mc_opinions_read_state();
    $stats = ['total'=>0,'pendiente'=>0,'publicado'=>0,'rechazado'=>0,'oculto'=>0,'average'=>0];
    $publishedSum = 0;
    $publishedCount = 0;
    foreach ($state['items'] as $item) {
        $stats['total']++;
        $status = (string)($item['estado'] ?? 'pendiente');
        if (isset($stats[$status])) $stats[$status]++;
        if ($status === 'publicado') {
            $publishedSum += (int)($item['calificacion'] ?? 0);
            $publishedCount++;
        }
    }
    $stats['average'] = $publishedCount > 0 ? round($publishedSum / $publishedCount, 1) : 0;
    return $stats;
}

function mc_opinions_admin_list($filter = '') {
    $state = mc_opinions_read_state();
    $items = $state['items'];
    if ($filter !== '') {
        $items = array_values(array_filter($items, fn($item) => ($item['estado'] ?? '') === $filter));
    }
    usort($items, function ($a, $b) {
        $date = (strtotime((string)($b['created_at'] ?? '')) ?: 0) <=> (strtotime((string)($a['created_at'] ?? '')) ?: 0);
        if ($date !== 0) return $date;
        return (int)($b['id'] ?? 0) <=> (int)($a['id'] ?? 0);
    });
    return $items;
}

function mc_opinion_get($id) {
    $id = (int)$id;
    $state = mc_opinions_read_state();
    foreach ($state['items'] as $item) {
        if ((int)($item['id'] ?? 0) === $id) return $item;
    }
    return null;
}

function mc_opinion_set_status($id, $status) {
    if (!in_array($status, ['pendiente','publicado','rechazado','oculto'], true)) {
        throw new RuntimeException('Estado de opinión no válido.');
    }
    $state = mc_opinions_read_state();
    $found = false;
    foreach ($state['items'] as &$item) {
        if ((int)($item['id'] ?? 0) !== (int)$id) continue;
        $item['estado'] = $status;
        $item['updated_at'] = date('Y-m-d H:i:s');
        $found = true;
        break;
    }
    unset($item);
    if (!$found) throw new RuntimeException('Opinión no encontrada.');
    return mc_opinions_write_state($state);
}

function mc_opinion_toggle_featured($id) {
    $state = mc_opinions_read_state();
    $found = false;
    foreach ($state['items'] as &$item) {
        if ((int)($item['id'] ?? 0) !== (int)$id) continue;
        $item['destacado'] = empty($item['destacado']) ? 1 : 0;
        $item['updated_at'] = date('Y-m-d H:i:s');
        $found = true;
        break;
    }
    unset($item);
    if (!$found) throw new RuntimeException('Opinión no encontrada.');
    return mc_opinions_write_state($state);
}

function mc_opinion_delete($id) {
    $state = mc_opinions_read_state();
    $before = count($state['items']);
    $state['items'] = array_values(array_filter($state['items'], fn($item) => (int)($item['id'] ?? 0) !== (int)$id));
    if ($before === count($state['items'])) throw new RuntimeException('Opinión no encontrada.');
    return mc_opinions_write_state($state);
}

function mc_opinion_update($id, $data) {
    $state = mc_opinions_read_state();
    $found = false;
    foreach ($state['items'] as &$item) {
        if ((int)($item['id'] ?? 0) !== (int)$id) continue;
        $sede = trim((string)($data['sede'] ?? $item['sede']));
        $rating = (int)($data['calificacion'] ?? $item['calificacion']);
        $status = (string)($data['estado'] ?? $item['estado']);
        if (!in_array($sede, mc_opinion_sedes(), true)) throw new RuntimeException('Selecciona una sede válida.');
        if ($rating < 1 || $rating > 5) throw new RuntimeException('La calificación debe estar entre 1 y 5.');
        if (!in_array($status, ['pendiente','publicado','rechazado','oculto'], true)) throw new RuntimeException('Estado de opinión no válido.');
        $item['nombre'] = trim((string)($data['nombre'] ?? $item['nombre']));
        $item['sede'] = $sede;
        $item['calificacion'] = $rating;
        $item['comentario'] = trim((string)($data['comentario'] ?? $item['comentario']));
        $item['estado'] = $status;
        $item['destacado'] = !empty($data['destacado']) ? 1 : 0;
        $item['updated_at'] = date('Y-m-d H:i:s');
        $found = true;
        break;
    }
    unset($item);
    if (!$found) throw new RuntimeException('Opinión no encontrada.');
    return mc_opinions_write_state($state);
}
'''
          Path('cms/opiniones.php').write_text(opinions_php, encoding='utf-8')

          api_path = Path('opiniones_api.php')
          api = api_path.read_text(encoding='utf-8')
          api = api.replace(
              'El módulo de opiniones aún no puede conectarse a MySQL.',
              'El módulo de opiniones no puede abrir su archivo JSON de almacenamiento.'
          )
          api_path.write_text(api, encoding='utf-8')

          admin_path = Path('admin/opiniones.php')
          admin = admin_path.read_text(encoding='utf-8')
          admin = admin.replace(
              'No se pudo conectar al MySQL de opiniones. En XAMPP se usa por defecto 127.0.0.1, base multicreditv2, usuario root y contraseña vacía. Si tu MySQL usa otros datos, crea cms/config/database.php a partir de database.example.php.',
              'No se pudo abrir el archivo JSON de opiniones. Revisa que la carpeta cms/data tenga permisos de escritura.'
          )
          admin = admin.replace('No se pudieron leer las opiniones desde MySQL.', 'No se pudieron leer las opiniones desde el archivo JSON.')
          admin = admin.replace('<h2>Configuración de MySQL</h2>', '<h2>Almacenamiento JSON</h2>')
          admin = admin.replace(
              'En XAMPP normalmente no necesitas configurar nada: el módulo intenta crear automáticamente la base <b>multicreditv2</b> y la tabla <b>opiniones</b>. Si tu MySQL tiene contraseña o usa otro usuario, copia <b>cms/config/database.example.php</b> como <b>cms/config/database.php</b> y coloca tus datos locales.',
              'Las opiniones se guardan directamente en <b>cms/data/opiniones.json</b>. No necesitas MySQL para este módulo. La carpeta <b>cms/data</b> debe permitir escritura a PHP.'
          )
          admin_path.write_text(admin, encoding='utf-8')

          ignore_path = Path('.gitignore')
          ignore = ignore_path.read_text(encoding='utf-8') if ignore_path.exists() else ''
          for entry in ['cms/data/opiniones.json', 'cms/data/opiniones.json.tmp']:
              if entry not in ignore.splitlines():
                  ignore += ('\n' if ignore and not ignore.endswith('\n') else '') + entry + '\n'
          ignore_path.write_text(ignore, encoding='utf-8')
          PY

      - name: Validar PHP y JSON
        shell: bash
        run: |
          php -l encabezado.php
          php -l footer.php
          php -l cms/opiniones.php
          php -l opiniones_api.php
          php -l admin/opiniones.php
          php -r "json_decode(file_get_contents('cms/data/site.json'), true, 512, JSON_THROW_ON_ERROR); echo 'site.json OK'.PHP_EOL;"
          php -r "require 'cms/opiniones.php'; mc_opinions_install(); var_export(mc_opinions_summary()); echo PHP_EOL;"
          test -f img/multicredit-logo-color.webp
          grep -q "nav_news" cms/data/site.json
          grep -q "mc-interest-link" footer.php
          ! grep -q "mc-navy-theme.css" encabezado.php

      - name: Guardar corrección y retirar workflow temporal
        shell: bash
        run: |
          rm -f .github/workflows/fix-restaurar-web-opiniones-json.yml
          git config user.name "Isac181004"
          git config user.email "isacvasquez017@gmail.com"
          git add -A
          git commit -m "fix: restaurar web, logo y opiniones JSON"
          git push origin HEAD:fix/restaurar-web-opiniones-json-logo
