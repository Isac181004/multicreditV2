name: Aplicar rebranding Multicredit 2026

on:
  push:
    branches:
      - feat/rebrand-navy-gray-2026

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/rebrand-navy-gray-2026
          fetch-depth: 0

      - name: Aplicar paleta y logo
        run: python scripts/rebrand_2026.py

      - name: Validar sintaxis PHP
        shell: bash
        run: |
          set -e
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find . -type f -name '*.php' -not -path './docs/*' -print0)

      - name: Validar JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path('.').rglob('*.json'):
              if '.git' in p.parts:
                  continue
              with p.open(encoding='utf-8') as f:
                  json.load(f)
              print('OK', p)
          PY

      - name: Validar branding global
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          theme = Path('css/mc-brand-2026.css')
          assert theme.exists(), 'Falta css/mc-brand-2026.css'
          css = theme.read_text(encoding='utf-8')
          for c in ['#0B1F3A','#163A5F','#071525','#6B7280','#D1D5DB','#F3F4F6','#FFFFFF','#0A0A0A']:
              assert c in css, f'Falta color {c}'
          site = Path('cms/data/site.json').read_text(encoding='utf-8')
          assert 'uploads/logo/20260904_232938_5c89c80d.png' in site
          print('Branding OK')
          PY

      - name: Guardar cambios
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Sin cambios pendientes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(brand): aplicar paleta navy gris blanco negro"
          git push origin HEAD:feat/rebrand-navy-gray-2026
